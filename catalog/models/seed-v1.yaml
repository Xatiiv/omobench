inclusion_policy: >-
  Publicly downloadable open weights with a published licence that permits use
  and publication of benchmark results. OmoBench does not redistribute weights.
  "Publicly downloadable" means obtainable by anybody willing to accept the
  publisher's terms, which a gate open to all satisfies and a gate restricted
  to approved organisations does not. Each model is judged on its own terms.
#
# THIS FILE IS THE AUTHORITATIVE MODEL IDENTITY AND ELIGIBILITY RECORD.
#
# A model has one identity, one publisher and one licence. It has many ways of
# being run -- quantisations, runtimes, context lengths, placements -- and
# those belong in catalog/workloads/, whose recipes reference these ids and
# repeat none of these facts. Duplicating a licence across six recipes is how
# five of them end up wrong.
#
# Membership is a recommendation, not a condition of submission: see
# docs/model-eligibility.md. What membership buys is that a reviewer does not
# have to re-establish the licence and the modality, which is exactly why they
# are recorded here and nowhere else.
#
# `verified` is the day somebody read the model's own card. Null means the
# entry is carried from an earlier list and has not been re-read.
