catalog_version: 1
# Workloads, not a leaderboard of models.
#
# OmoBench measures hardware. A model is the load you put on a machine to find
# out what it does, the way a fixed dataset is the load you put on a database.
# This file is the curated set of such loads: known-good, licence-checked,
# pinned where a pinned artefact exists.
#
# It is a recommendation and nothing more. A model that is not here can still
# be benchmarked and still be submitted, on exactly the requirements in
# docs/model-eligibility.md. Being here means somebody has already checked the
# licence and the modality so a reviewer does not have to.
purpose: >-
  Curated text-generation workloads for evaluating hardware. Membership is a
  recommendation, never a condition of submission. See docs/model-eligibility.md.

# How the fit tiers below were arrived at, so nobody reads them as measurements.
#
# `expected_fit` is ARITHMETIC, not a benchmark result. For a quantised GGUF
# it is the weight file plus a working allowance:
#
#     weights + KV cache + runtime overhead
#
# with the KV cache taken at the profile's own context (chat-small-* serves at
# 2048) and the overhead at 1 GB, which is what llama.cpp b10621 was observed
# to need on this project's own laptop. Where the exact weight file is pinned
# below, the weight figure is that file's real size. Where it is not, the
# weight figure is `parameters x bits_per_weight / 8`, which is an estimate of
# an estimate and is marked `estimated: true`.
#
# Two things this deliberately does not do. It does not promise the run will
# qualify -- "expected to fit" and "successfully benchmarked" are different
# claims, and only a result establishes the second. And it says nothing about
# how good the answers are: a bigger or faster model is not a better one, and
# this file ranks nothing.
estimate_basis:
  context_tokens: 2048
  runtime_overhead_gb: 1.0
  overhead_source: >-
    llama.cpp b10621 serving a 4B Q4_K_M model measured at 4.30 GB resident
    against a 2.5 GB weight file, on this project's own hardware. A different
    engine, a longer context or a larger batch will differ.
  caveat: >-
    Expected to fit is arithmetic about memory. It is not a prediction of
    speed, of acceptance, or of answer quality, and a machine that fits a
    workload can still fail to finish the profile.

