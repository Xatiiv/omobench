catalog_version: 2
# Workloads, not a leaderboard of models.
#
# OmoBench measures hardware. A model is the load you put on a machine to find
# out what it does, the way a fixed dataset is the load you put on a database.
# This file is the curated set of such loads: known-good, licence-checked,
# pinned where a pinned artefact exists.
#
# It is a recommendation and nothing more. A model that is not here can still
# be benchmarked and still be submitted, on exactly the requirements in
# docs/model-eligibility.md. Being here means somebody has already checked the
# licence and the modality so a reviewer does not have to.
purpose: >-
  Curated text-generation workloads for evaluating hardware. Membership is a
  recommendation, never a condition of submission. See docs/model-eligibility.md.

# FOUR DIFFERENT NUMBERS, and version 1 of this file conflated two of them.
#
#   weights_gb           the file on disk
#   load_memory_gb       what the server occupies once the model is loaded and
#                        has served a few requests
#   sustained_memory_gb  what it occupies by the END of a full profile
#   (available memory)   what the serving machine actually has, read at runtime
#
# The third is the one that matters and the one nobody thinks to ask about.
# Measured here on llama.cpp b10621 serving Qwen3-4B Q4_K_M: 2.5 GB of weights
# loaded to 4.30 GB resident, and by request 34 of a 60-request profile the
# process held 6.99 GB of ANONYMOUS memory -- not the mapped weight file, real
# allocations -- at which point the kernel killed it on a 7.49 GB machine.
#
#     Out of memory: Killed process 197464 (llama-server)
#       total-vm:12792992kB, anon-rss:6990392kB
#
# So "it loaded once" is not evidence that it fits. Version 1 of this file said
# Qwen3-4B Q4_K_M needed 4 GB, which was arithmetic from the weight file and
# was wrong by most of a factor of two for the thing people actually want to do
# with it. Where this session measured a number it is marked `measured: true`;
# everywhere else the sustained figure applies the one growth ratio observed
# here (6.99 / 4.30 = 1.63), which is a single observation of a single engine
# and is marked as an estimate.
#
# And a run that completes is still not a run that qualifies. `benchmark`
# records what has actually happened on real hardware, which for every entry
# here is less than people would assume.
estimate_basis:
  context_tokens: 2048
  runtime_overhead_gb: 1.0
  growth_ratio: 1.63
  growth_source: >-
    llama.cpp b10621, Qwen3-4B Q4_K_M, 34 requests of chat-small-extended-v1 on
    2026-11-06: resident 4.30 GB at start, 6.99 GB anonymous at the kernel's
    OOM kill. One observation, one engine, one model. A different engine, a
    longer context or a larger batch will differ, and this ratio should be
    replaced with real figures as they are measured.
  runner_allowance_gb: 1.2
  runner_allowance_source: >-
    The benchmark runner holds a tokenizer and its own process tree beside the
    server. Added only when the runner and the server share a machine, which is
    every same-host run and no bridged one.
  caveat: >-
    Expected to fit is arithmetic about memory. It is not a prediction of
    speed, of acceptance, or of answer quality, and a machine that fits a
    workload can still fail to finish the profile. Only a completed benchmark
    establishes that a machine ran something.

