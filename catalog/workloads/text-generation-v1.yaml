            benchmark: not-qualified
            benchmark_note: >-
              chat-small-v1 ran to its 900 s ceiling with 14 measured requests.
              chat-small-extended-v1 was killed by the kernel at 29 successful.
              No profile has qualified on that machine.
            recipe: qwen3-4b-cpu-v2
