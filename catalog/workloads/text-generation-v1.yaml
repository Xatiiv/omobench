# Checked and deliberately excluded, so the reasoning is on the record rather
# than looking like an oversight.
excluded:
  - id: google/gemma-3-4b-it
    reason: >-
      Multimodal. Its model card states "Gemma 3 models are multimodal,
      handling text and image input and generating text output", and its
      pipeline tag is image-text-to-text. OmoBench's profiles measure text
      generation, so it is out of scope here however good it is.
    checked: 2026-11-06
