name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical profile snapshots are verified against their source blobs.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the CLI package and validator dependency
        run: |
          python -m pip install --disable-pip-version-check -e './cli[bridge]'
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Run CLI unit tests
        run: python -m unittest discover -s cli/tests -v
      - name: Run registry validator unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate submitted result bundles
        run: python tools/validate_results.py

  runner-fixtures:
    name: CPU runner integration fixtures (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Covers the original development environment and the second-PC failure.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the managed CPU runner dependency policy
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
          python -m pip install --disable-pip-version-check --no-input --constraint cli/src/omobench/runner-constraints.txt -e './cli[ui,runner,bridge]'
          python -m pip check
      - name: Verify the actual runner and absence of CUDA dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import torch
          from omobench.cli import runner_health_check
          assert torch.__version__ == '2.15.0+cpu', torch.__version__
          nvidia = [d.metadata['Name'] for d in metadata.distributions() if d.metadata['Name'].lower().startswith('nvidia-')]
          assert not nvidia, nvidia
          health = runner_health_check()
          assert health.ok, health
          print(health)
          PY
      - name: Exercise the pinned runner with synthetic local requests only
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: cli/tests
        run: |
          python -m unittest -v test_chat_small_v2 test_measured_window_identity test_measured_window_semantics test_redirect_destination test_request_timeout test_bridge_http test_bridge_integration test_bridge_runner

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test website rendering and result interpretation
        run: node --test tests/*.test.mjs
