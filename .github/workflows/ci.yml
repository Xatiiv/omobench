name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the CLI package and validator dependency
        run: |
          python -m pip install --disable-pip-version-check -e ./cli
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Run CLI unit tests
        run: python -m unittest discover -s cli/tests -v
      - name: Run registry validator unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate submitted result bundles
        run: python tools/validate_results.py

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test website rendering and result interpretation
        run: node --test tests/*.test.mjs
