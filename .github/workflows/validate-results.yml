name: Validate benchmark submissions

on:
  pull_request:
    paths:
      - "results/**"
      - "schema/**"
      - "tools/validate_results.py"
  push:
    branches: [main]
    paths:
      - "results/**"
      - "schema/**"
      - "tools/validate_results.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate submitted results
        run: python tools/validate_results.py
