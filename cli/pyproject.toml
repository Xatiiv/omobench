[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omobench-cli"
version = "0.1.0"
description = "CLI scaffolding for reproducible OmoBench submissions"
requires-python = ">=3.10"
authors = [{ name = "OmoBench" }]
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
runner = ["guidellm[recommended]==0.7.3", "h11==0.16.0"]
ui = ["jsonschema==4.25.1", "h11==0.16.0"]
# Disabled experimental bridge frontend; no runtime activation or CLI entry.
bridge = ["h11==0.16.0"]

[project.scripts]
omobench = "omobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
omobench = ["web/*.html", "web/*.css", "web/*.js", "runner-constraints.txt"]
