[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omobench-cli"
version = "0.1.0"
description = "CLI scaffolding for reproducible OmoBench submissions"
requires-python = ">=3.10"
authors = [{ name = "OmoBench" }]

[project.optional-dependencies]
runner = ["guidellm[recommended]==0.7.3"]

[project.scripts]
omobench = "omobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
